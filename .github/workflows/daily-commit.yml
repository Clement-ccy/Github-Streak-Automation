name: Daily GitHub Streak Commit

on:
  schedule:
    # Runs at 08:10 Asia/Shanghai every day.
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's log entry already exists"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: daily-github-streak
  cancel-in-progress: false

jobs:
  update-streak:
    runs-on: ubuntu-latest
    env:
      STREAK_FILE: activity/streak.md
      STREAK_TIMEZONE: Asia/Shanghai
      GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || github.actor }}
      GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || format('{0}@users.noreply.github.com', github.actor) }}
      FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update streak log
        run: python scripts/update_streak.py

      - name: Commit and push changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No file changes detected; skipping commit."
            exit 0
          fi

          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add "$STREAK_FILE"
          git commit -m "chore: update GitHub streak log"
          git push
