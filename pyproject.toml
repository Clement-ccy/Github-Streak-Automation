[project]
name = "github-streak-automation"
version = "0.1.0"
description = "Daily GitHub Actions automation that updates a streak log and pushes a commit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
